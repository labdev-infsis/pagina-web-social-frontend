<div class="post-container">

	<div class="header-post">
		@if (institution) {
		<div class="data-user">
			<img [src]="institution.logo_url" [alt]="'Foto de perfil'" class="img-profile" />
			<div class="info-user">
				<h2>{{ institution.name }}</h2>
				<p>{{ calculateTimePost() }}</p>
			</div>
		</div>
		}
		@if(authenticated === true && currentUser.role === 'ADMIN'){
			<div class="options-post d-flex justify-content-center align-items-center"
				(click)="showOptions.set(!showOptions())">
				<i class="bi bi-three-dots"></i>
			</div>
		}
	</div>

	<!-- Popup de opciones post Editar/Eliminar -->
	<app-options-post *ngIf="showOptions() && authenticated === true && currentUser.role === 'ADMIN'"
		(clickOutside)="showOptions.set(false)" [postReference]="post.uuid"
		(openEdit)="openModalEdit.set(true)"></app-options-post>

	<!-- Modals de editar y eliminar post -->
	<app-modal-edit-post [showModalEdit]="openModalEdit" [institution]="institution" [postToEdit]="sendCopyPost()"
		(postUpdatedEvent)="updatePost($event)"></app-modal-edit-post>
	<app-modal-delete-post (confirmDeletePost)="deletePost($event)" [postReference]="post.uuid"></app-modal-delete-post>

	<!-- Contenido de texto del post -->
	<p *ngIf="post.content.text != '' && allowedTextLength(); else reduceText" class="text-post"
		[innerHTML]="post.content.text"> </p>
	<ng-template #reduceText>
		<p id="{{'text-post-'+post.uuid}}" *ngIf="post.content.text != ''" class="text-post">
			{{adjustedTextLength()}}<span class="see-more fw-bold" (click)="showAllText(post.uuid)">Ver más</span></p>
	</ng-template>

	<!-- Si hay contenido multi media (imagenes/videos, documento) -->
	<!--@if (listMediaPost.length > 0) {-->
	<ng-container *ngIf="listMediaPost.length > 0">

		<!-- Visualizar posts con imagenes y/o videos -->
		<div *ngIf="post.content.media[0].type != 'document'" class="post-medias"
			[ngClass]="getGridClass(listMediaPost)">
			<ng-container *ngFor="let media of listMediaPost; let i = index">
				<!-- Mostrar las primeras 4 imágenes/videos directamente -->
				<div *ngIf="i < 3 || listMediaPost.length == 4" class="media-post"
					[ngClass]="{'three': listMediaPost.length == 3 && i == 0}">
					<img *ngIf="typeImages.includes(media.type); else mostrarVideo" [src]="media.path"
						[alt]="media.name || 'Imagen del post'">
					<ng-template #mostrarVideo>
						<video [src]="media.path" controls></video>
					</ng-template>
				</div>
				<!-- Quinta imagen/video: Con superposición si hay más media -->
				<div *ngIf="i === 3 && listMediaPost.length > 4" class="media-post">
					<div class="more">
						<img *ngIf="typeImages.includes(media.type); else mostrarVideo" [src]="media.path"
							[alt]="media.name || 'Imagen del post'">
						<ng-template #mostrarVideo>
							<video [src]="media.path" controls></video>
						</ng-template>
						<div class="overlay">+{{ listMediaPost.length - 4 }}</div>
					</div>
				</div>
			</ng-container>
		</div>

		<!-- Visualizar post con solo documento -->
		<ng-container *ngIf="post.content.media[0].type == 'document'">
			<a [href]="post.content.media[0].path" target="_blank" class="text-decoration-none">
				<div class="doc-post d-flex justify-content-center">
					<pdf-viewer [src]="post.content.media[0].path" [render-text]="true" [original-size]="false"
						style="width: 400px; height: 500px;" [autoresize]="true" class="pdf-viewer"></pdf-viewer>
				</div>
			</a>
		</ng-container>
	</ng-container>
	<!--}-->
	<hr>
	<!-- Cantidad de reacciones y comentarios -->
	<div class="interactions-quantity " *ngIf="amountReactions() > 0 || amountComments() > 0">
		<div *ngIf="amountReactions() > 0" [attr.data-bs-target]="'#reactions-'+post.uuid" data-bs-toggle="modal">
			<span class="quantity">{{ totalReactions() }}</span>
			<i class="bi bi-hand-thumbs-up icon"></i>
		</div>
		<app-modal-list-reactions [reactions]="post.reactions" [postReference]="post.uuid"></app-modal-list-reactions>
		<div class="divisor" *ngIf="amountComments() > 0"></div>
		<div class="item" *ngIf="amountComments() > 0" (click)="openViewPostComments(post)">
			<span class="quantity">{{ post.commentCounter.totalComments }}</span>
			<i class="bi bi-chat-left-text icon"></i>
		</div>
		<!--<div class="divisor"></div> -->
		<div class="item" hidden>
			<span class="quantity">20</span>
			<i class="fa fa-share icon"></i>
		</div>
	</div>

	<hr [ngClass]="{'hr-post-division': amountReactions() == 0 && amountComments() == 0}" [hidden]="!authenticated">

	<!-- Botones de reaccionar, comentar y compartir -->
	<!--<div class="bottuns d-flex justify-content-evenly m-2" [hidden]="!authenticated">-->
	<div class="bottuns" [hidden]="!authenticated">
		<!-- Boton de Reaccionar -->
		<button type="button" class="btn icon-btn" [ngClass]="myReaction.class" id="btn-like" [hidden]="!authenticated"
			[disabled]="!authenticated" (click)="reactUserBoton(post.uuid)">
			<i class="{{ myReaction.emoji }}"
				*ngIf="myReaction.class == 'thumbs-up' || myReaction.class == 'red-heart' || myReaction.class == 'default'"></i>
			<img src="../../../../assets/{{myReaction.class}}.png" class="{{myReaction.class}}"
				*ngIf="myReaction.class == 'crying-face' || myReaction.class == 'angry-face'">
			<span class="ms-1">{{ myReaction.name }}</span>
			<!-- Opciones de reaccion  -->
			<div class="option-reactions">
				<i class="fa-solid fa-thumbs-up" (click)="clickReaction(post.uuid, 'thumbs-up', $event)"></i>
				<i class="fa-solid fa-heart" (click)="clickReaction(post.uuid, 'red-heart', $event)"></i>
				<img src="../../../../assets/crying-face.png" class="crying-face"
					(click)="clickReaction(post.uuid, 'crying-face', $event)">
				<img src="../../../../assets/angry-face.png" class="angry-face"
					(click)="clickReaction(post.uuid, 'angry-face', $event)">
			</div>
		</button>

		<button type="button" class="btn icon-btn" id="btn-comment" [hidden]="!authenticated"
			[disabled]="!authenticated" (click)="openViewPostComments(post)">
			<i class="bi bi-chat-left-text"></i>
			Comentar</button>
		<!-- Boton de Compartir -->
		<button type="button" class="btn icon-btn" id="btn-share" [hidden]="!authenticated">
			<i class="fa-solid fa-share"></i>
			Compartir</button>
	</div>


	<!-- Boton de Comentar -->
</div>
