<!-- Area para seleccionar imagenes videos -->
<div class="area-media" *ngIf="showAreaMedia()">
  <button type="button" class="btn-close m-0" aria-label="Close" (click)="closeCleanPreviewMedia()"></button>
  <div *ngIf="!showPreviewMedia" class="back-media d-flex flex-column align-items-center justify-content-center" (click)="openInputFileMedia()" (keypress)="changeInputMedia($event)" (drop)="changeInputMedia($event)" (dragover)="onDragOver($event)">
    <i class="bi bi-plus-square-dotted fs-4"></i>
    <h5 class="mb-0">Añadir fotos/vídeos</h5>
    <label class="text-secondary" for="input-file-img-vid">o usa la opción de arrastrar y soltar</label>
    <div class="text-secondary">Tamaño máximo: 1 GB.</div>
  </div>

  <!-- Spinner de carga -->
  <div *ngIf="isLoadingMedia" class="loading-overlay w-100 d-flex flex-column align-items-center">
    <div class="spinner-border text-primary"></div>
    <span class="visually-hidden">Cargando...</span>
  </div>

  <!-- Preview de imagenes videos elegidos -->
  <div class="images-videos" *ngIf="showPreviewMedia && !isLoadingMedia" [ngClass]="getGridClass()">
    <!-- Iterar imagenes y videos -->
    <ng-container *ngFor="let media of mediaListPreview; let i = index"> 
      <!-- Mostrar las primeras 4 imágenes o videos directamente -->
       <!-- Mostrar <img> si es una imagen -->
      <img *ngIf="isImage(media.type) && (i < 3 || mediaListPreview.length == 4); else mostrarVideo" [src]="media.url" alt="post" [ngClass]="{'three': mediaListPreview.length == 3 && i === 0}">
      <!-- Mostrar <video> si no es una imagen -->
      <ng-template #mostrarVideo>
        <video *ngIf="(i < 3 || mediaListPreview.length == 4) && media.url" [src]="media.url" controls [ngClass]="{'three': mediaListPreview.length == 3 && i === 0}"></video>
      </ng-template>
      <!-- Quinta imagen/video: Con superposición si hay más media -->
      <div *ngIf="i === 3 && mediaListPreview.length > 4" class="more">
        <img *ngIf="isImage(media.type); else mostrarVideo" [src]="media.url" alt="post">
        <ng-template #mostrarVideo>
          <video [src]="media.url" controls></video>
        </ng-template>
        <div class="overlay">+{{ mediaListPreview.length - 4 }}</div>
      </div>
    </ng-container>
  </div>
</div>
<input #fileInput type="file" name="" id="input-file-img-vid" hidden (input)="changeInputMedia($event)" multiple accept="image/*,video/*">
