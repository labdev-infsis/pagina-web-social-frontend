<div class="modal-backdrop">
  <div class="modal-container">
    <!-- Modal Header -->
    <div class="modal-header text-center">
      <h4 class="modal-title w-100">Publicación de {{ postAuthor }}</h4>
      <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismissAll('Cross click')"></button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <div class="post-details">
        <!-- Información del autor -->
        <div class="d-flex flex-column">
          <div class="d-flex flex-row justify-content-start" *ngIf="institution">
            <img [src]="institution.logo_url" alt="Foto de perfil" class="img-profile" />
            <div class="info-user">
              <h2>{{ institution.name }}</h2>
              <p>{{ calculateTimePost() }}</p>
            </div>
          </div>

          <!-- Descripción del post -->
          <p class="post-description">{{ postDescription }}</p>

          <!-- Imagen o contenido multimedia -->
          <div class="object-fit-md-contain border rounded">
            <ng-container *ngIf="postImages">
              <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner image-box text-center">
                  <div *ngFor="let image of postImages; let i = index" class="carousel-item" [ngClass]="{ 'active': i === 0 }">
                    <ng-container *ngIf="image.type === 'image'">
                      <img [src]="image.path" class="object-fit-scale" alt="Imagen del post" />
                    </ng-container>
                    <ng-container *ngIf="image.type === 'video'">
                      <video [src]="image.path" controls class="video"></video>
                    </ng-container>
                    <ng-container *ngIf="image.type === 'document'">
                      <div class="iframe-custom-container">
                        <pdf-viewer [src]="image.path" [render-text]="true" [original-size]="false" class="pdf-viewer"></pdf-viewer>
                      </div>
                    </ng-container>
                  </div>
                </div>
                <ng-container *ngIf="postImages.length > 1">
                  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                  </button>
                  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                  </button>
                </ng-container>
              </div>
            </ng-container>
          </div>

          <!-- Lista de comentarios -->
          <app-comment-list [comments]="comments" [currentUser]="currentUser" [authenticated]="authenticated" (onAddReply)="handleAddReply($event)">
          </app-comment-list>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="modal-footer">
      <div class="comment-section d-flex flex-row align-items-center">
        <img *ngIf="currentUser" [src]="currentUser.photo_profile_path || '/assets/default-avatar.png'" alt="Foto de perfil" class="comment-img" />
        <div *ngIf="authenticated" class="comment-box d-flex align-items-center">
          <input #commentInput [(ngModel)]="newComment" placeholder="Escribe un comentario..." class="comment-input" (keydown.enter)="addComment()" />
          <button (click)="addComment()" class="send-comment-button">
            <i class="bi bi-send"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
