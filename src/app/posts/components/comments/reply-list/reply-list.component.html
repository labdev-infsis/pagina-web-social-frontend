<div class="replies">
  <div *ngFor="let reply of replies | slice:0:getLimit(parentUuid)" class="reply-wrapper">
    <!-- Contenido de la respuesta -->
    <div class="d-flex align-items-start reply-row">
      <img [src]="reply.user_photo || 'assets/default-avatar.png'" alt="Foto de perfil" class="reply-img" />
      <div class="comment-bubble">
        <p class="mb-1"><strong>{{ reply.name }} {{ reply.lastName }}</strong></p>
        <p class="mb-1">{{ reply.content }}</p>

        <!-- ...existing code... -->
        <div class="comment-actions mt-1">
          <span class="comment-time">{{ calculateTimeFromNow(reply.createdDate) }}</span>
          <span class="mx-1">·</span>
          <ng-container *ngIf="authenticated">
            <button class="reply-btn" (click)="toggleReplyInput.emit(reply.uuid)">Responder</button>
            <div class="fb-reaction-btn-wrapper" (mouseenter)="showEmojiOptions[reply.uuid]=true"
              (mouseleave)="showEmojiOptions[reply.uuid]=false">
              <button type="button" class="fb-reaction-btn" [ngClass]="getEmojiClass(reply.uuid)"
                (click)="reactToReply(reply.uuid, getSelectedEmoji(reply.uuid)?.uuid || defaultEmoji.uuid)">
                <ng-container *ngIf="getSelectedEmoji(reply.uuid); else defaultLike">
                  <span class="emoji">{{ getSelectedEmoji(reply.uuid)?.emoji_code }}</span>
                  <span class="label">{{ getEmojiLabel(getSelectedEmoji(reply.uuid)?.emoji_name) }}</span>
                </ng-container>
                <ng-template #defaultLike>
                  <i class="fa-regular fa-thumbs-up"></i>
                  <span class="label">Me gusta</span>
                </ng-template>
              </button>
              <div class="fb-emoji-options" *ngIf="showEmojiOptions[reply.uuid]">
                <ng-container *ngFor="let emoji of emojis">
                  <span class="emoji-option" [title]="emoji.emoji_name"
                    (click)="reactToReply(reply.uuid, emoji.uuid, true); showEmojiOptions[reply.uuid]=false">
                    {{ emoji.emoji_code }}
                  </span>
                </ng-container>
              </div>
            </div>
          </ng-container>
          <span class="reply-reactions-count" *ngIf="getReplyReactionsCount(reply) > 0"
            (click)="openReplyReactionsModal(reply.uuid)" style="cursor:pointer">
            {{ getReplyReactionsCount(reply) }}
            <i class="bi bi-hand-thumbs-up icon"></i>
          </span>
        </div>
        <!-- ...existing code... -->
      </div>
    </div>
    <!-- Input para responder a esta respuesta -->
    <div *ngIf="replyInputVisible[reply.uuid]" class="reply-box">
      <img [src]="currentUser?.photo_profile_path || 'assets/default-avatar.png'" alt="Foto de perfil"
        class="reply-img" />
      <div class="reply-input-container">
        <input [(ngModel)]="replyText[reply.uuid]" placeholder="Escribe una respuesta..." class="reply-input"
          (keydown.enter)="addReply.emit({ replyUuid: reply.uuid, isTopLevel: false })" />
        <button class="send-reply-btn" (click)="addReply.emit({ replyUuid: reply.uuid, isTopLevel: false })">
          <i class="bi bi-send"></i>
        </button>
      </div>
    </div>
    <!-- Respuestas anidadas -->
    <div *ngIf="reply.replies && reply.replies.length > 0">
      <app-reply-list [parentUuid]="reply.uuid" [replies]="reply.replies" [currentUser]="currentUser"
        [replyInputVisible]="replyInputVisible" [replyText]="replyText" [replyLimit]="replyLimit"
        [authenticated]="authenticated" (toggleReplyInput)="toggleReplyInput.emit($event)"
        (addReply)="addReply.emit($event)" (showAllReplies)="showAllReplies.emit($event)"
        (showLessReplies)="showLessReplies.emit($event)">
      </app-reply-list>
      <button class="view-more-replies" *ngIf="getLimit(reply.uuid) < (reply.replies?.length || 0)"
        (click)="showAllReplies.emit(reply.uuid)">
        Ver más respuestas
      </button>
      <button class="view-less-replies"
        *ngIf="getLimit(reply.uuid) === (reply.replies?.length || 0) && (reply.replies?.length || 0) > 1"
        (click)="showLessReplies.emit(reply.uuid)">
        Ver menos respuestas
      </button>
    </div>
  </div>
</div>
