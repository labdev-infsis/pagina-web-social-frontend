<div class="reply-wrapper">
  <div class="d-flex flex-row">
    <img [src]="reply.user_photo || 'assets/default-avatar.png'" alt="Foto de perfil" class="reply-img" />
    <div class="reply-content">
      <p class="reply-name"><strong>{{ reply.user_name }}</strong></p>
      <p class="reply-text">{{ reply.content }}</p>
      <span class="reply-time">{{ calculateTimeFromNow(reply.date) }}</span>
      <button class="reply-btn" (click)="onToggleReplyInput(reply.uuid)">Responder</button>
    </div>
  </div>
  <!-- Aquí puedes agregar un componente de reacciones si lo tienes -->
  <app-comment-input
    *ngIf="replyInputVisible && replyInputVisible[reply.uuid]"
    [currentUser]="currentUser"
    [isReply]="true"
    [replyText]="replyText && replyText[reply.uuid]"
    (send)="onAddReply(reply.uuid, reply.uuid, false)">
  </app-comment-input>
  <!-- Respuestas anidadas -->
  <app-reply-list
    [replies]="reply.replies"
    [currentUser]="currentUser"
    [replyInputVisible]="replyInputVisible"
    [replyText]="replyText"
    [replyLimit]="replyLimit"
    [authenticated]="authenticated"
    (toggleReplyInput)="toggleReplyInput.emit($event)"
    (addReply)="addReply.emit($event)"
    (showAllReplies)="showAllReplies.emit($event)"
    (showLessReplies)="showLessReplies.emit($event)">
  </app-reply-list>
</div>
